booth:
  name: "Photo Booth"

session:
  photos_per_session: 4
  countdown_seconds: 3
  delay_between_photos_ms: 1000

camera:
  resolution_width: 2304
  resolution_height: 1296
  preview_width: 960
  preview_height: 540
  autofocus: true

display:
  fullscreen: false
  orientation: portrait
  width: 720
  height: 1280

storage:
  path: "photos"
  minimum_free_space_mb: 1000

sharing:
  enabled: true
  hostname: "0.0.0.0"
  port: 8080

hardware:
  physical_button: false
  button_gpio: 17

logging:
  path: "logs/photobooth.log"
  level: "INFO"
  max_bytes: 1000000
  backup_count: 3

processing:
  # One of: classic, wedding, birthday, graduation, holiday
  template: "classic"
  # One of: null, grayscale, sepia, vivid, bw_high_contrast
  filter: null

cleanup:
  enabled: true
  max_age_days: 30
  run_on_startup: true

admin:
  enabled: true
  # Seconds to hold the booth logo on the Welcome screen to open Admin Mode.
  hold_seconds: 5.0
