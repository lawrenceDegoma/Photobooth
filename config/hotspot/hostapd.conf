# hostapd configuration for the Photo Booth offline Wi-Fi hotspot
# (README Milestone 7 — Offline Hotspot).
#
# Installed to /etc/hostapd/hostapd.conf by scripts/setup_hotspot.sh.
# Turns the Pi's wlan interface into its own access point so guests can
# connect and retrieve photos with no internet, router, or venue Wi-Fi.

# Interface to run the AP on. wlan0 is typical on Raspberry Pi; if the
# built-in Wi-Fi is also used for internet uplink, use a USB Wi-Fi adapter
# and point this at that interface instead (e.g. wlan1).
interface=wlan0
driver=nl80211

# Network name guests will see.
ssid=PhotoBooth

# 2.4GHz for maximum device compatibility (older phones, etc).
hw_mode=g
channel=7

# 802.11n
ieee80211n=1
wmm_enabled=1

# Broadcast the SSID (not hidden).
ignore_broadcast_ssid=0

# Authentication: WPA2-PSK. Change wpa_passphrase before deploying at a
# real event. Must be 8-63 characters.
auth_algs=1
wpa=2
wpa_key_mgmt=WPA-PSK
wpa_passphrase=photobooth123
rsn_pairwise=CCMP

# Maximum simultaneous guest connections.
max_num_sta=32
