# dnsmasq configuration for the Photo Booth offline Wi-Fi hotspot
# (README Milestone 7 — Offline Hotspot).
#
# Installed to /etc/dnsmasq.d/photobooth.conf by scripts/setup_hotspot.sh.
# Provides DHCP + local DNS for guest devices connecting to the hostapd
# access point defined in hostapd.conf, so phones get an IP automatically
# without any internet-facing router.

# Only listen on the hotspot interface.
interface=wlan0
bind-interfaces

# DHCP range handed out to guest devices, matching the static IP assigned
# to wlan0 by setup_hotspot.sh (192.168.4.1/24).
dhcp-range=192.168.4.2,192.168.4.100,255.255.255.0,24h

# Advertise the Pi itself as the default gateway and DNS server, though no
# internet is actually reachable through it -- this is only needed so
# devices accept the network without complaining.
dhcp-option=3,192.168.4.1
dhcp-option=6,192.168.4.1

# Resolve the photobooth hostname to the Pi's hotspot IP so the QR code /
# sharing URL can use a friendly name instead of a raw IP if desired.
address=/photobooth.local/192.168.4.1
